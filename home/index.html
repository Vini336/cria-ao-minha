<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga Zenith</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="home">
    <header class="app-header">
      <a class="brand" href="../home/" aria-label="Manga Zenith">
        <span class="brand-mark">Z</span>
        <span>Manga Zenith</span>
      </a>
      <nav class="top-nav" aria-label="Navegacao principal">
        <a href="../home/" data-route="home">Inicio</a>
        <a href="../library/" data-route="library">Minha lista</a>
        <a href="../search/" data-route="search">Buscar</a>
        <a href="../progress/" data-route="progress">Progresso</a>
        <a href="../admin/" data-route="admin">Admin</a>
      </nav>
      <div class="user-menu" id="userMenu" hidden>
        <span id="userName"></span>
        <button class="button secondary" id="logoutButton" type="button">Sair</button>
      </div>
      <button class="button secondary" id="authButton" type="button">Entrar</button>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Alternar tema">
        <span id="themeIcon">Lua</span>
      </button>
    </header>

    <main>
      <section class="view hero-view" id="homeView">
        <div class="hero-copy">
          <p class="eyebrow">Lista pessoal de mangas</p>
          <h1>Manga Zenith</h1>
          <p>
            Monte sua lista no estilo AniList, marque o que esta lendo, acompanhe capitulos,
            favorite obras e continue de onde parou direto pelo navegador.
          </p>
          <div class="hero-actions">
            <a class="button primary" href="../library/">Ver minha lista</a>
            <a class="button secondary" href="../search/">Adicionar manga</a>
          </div>
        </div>
        <div class="home-catalog" aria-label="Mangas salvos">
          <input id="homeSearchInput" type="search" placeholder="Procurar na sua lista" />
          <div class="home-manga-grid" id="homeMangaGrid"></div>
        </div>
      </section>
    </main>

    <template id="mangaCardTemplate">
      <article class="manga-card">
        <button class="cover-button" type="button">
          <img alt="" loading="lazy" />
        </button>
        <div class="manga-card-body">
          <div>
            <h3></h3>
            <p></p>
          </div>
          <div class="card-meta"></div>
        </div>
      </article>
    </template>

    <script src="../app.js"></script>
  </body>
</html>
