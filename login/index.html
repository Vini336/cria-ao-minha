<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Manga Zenith</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="login">
    <header class="app-header">
      <a class="brand" href="../home/" aria-label="Manga Zenith">
        <span class="brand-mark">Z</span>
        <span>Manga Zenith</span>
      </a>
      <nav class="top-nav" aria-label="Navegacao principal">
        <a href="../home/" data-route="home">Inicio</a>
        <a href="../library/" data-route="library">Minha lista</a>
        <a href="../search/" data-route="search">Buscar</a>
        <a href="../progress/" data-route="progress">Progresso</a>
        <a href="../admin/" data-route="admin">Admin</a>
      </nav>
      <div class="user-menu" id="userMenu" hidden>
        <span id="userName"></span>
        <button class="button secondary" id="logoutButton" type="button">Sair</button>
      </div>
      <button class="button secondary" id="authButton" type="button">Entrar</button>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Alternar tema">
        <span id="themeIcon">Lua</span>
      </button>
    </header>

    <main>
      <section class="auth-view" id="authView">
        <div class="auth-panel">
          <div>
            <p class="eyebrow">Conta sincronizada</p>
            <h1>Manga Zenith</h1>
            <p>Entre para manter sua lista, favoritos e progresso sincronizados entre computador e celular.</p>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="Acesso">
            <button class="active" id="loginTab" type="button">Login</button>
            <button id="registerTab" type="button">Registro</button>
          </div>

          <form class="auth-form" id="loginForm">
            <label>
              Usuario
              <input name="login" autocomplete="username" required />
            </label>
            <label>
              Senha
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <button class="button primary" type="submit">Entrar</button>
          </form>

          <form class="auth-form" id="registerForm" hidden>
            <label>
              Usuario
              <input name="username" autocomplete="username" required minlength="3" />
            </label>
            <label>
              Senha
              <input name="password" type="password" autocomplete="new-password" required minlength="4" />
            </label>
            <button class="button primary" type="submit">Criar conta</button>
          </form>

          <p class="auth-status" id="authStatus"></p>
        </div>
      </section>
    </main>

    <script src="../app.js"></script>
  </body>
</html>
