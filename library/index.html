<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha lista - Manga Zenith</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="library">
    <header class="app-header">
      <a class="brand" href="../home/" aria-label="Manga Zenith">
        <span class="brand-mark">Z</span>
        <span>Manga Zenith</span>
      </a>
      <nav class="top-nav" aria-label="Navegacao principal">
        <a href="../home/" data-route="home">Inicio</a>
        <a href="../library/" data-route="library">Minha lista</a>
        <a href="../search/" data-route="search">Buscar</a>
        <a href="../progress/" data-route="progress">Progresso</a>
        <a href="../admin/" data-route="admin">Admin</a>
      </nav>
      <div class="user-menu" id="userMenu" hidden>
        <span id="userName"></span>
        <button class="button secondary" id="logoutButton" type="button">Sair</button>
      </div>
      <button class="button secondary" id="authButton" type="button">Entrar</button>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Alternar tema">
        <span id="themeIcon">Lua</span>
      </button>
    </header>

    <main>
      <section class="view page-view" id="libraryView">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Biblioteca pessoal</p>
            <h2>Minha lista</h2>
          </div>
          <div class="library-tools">
            <select id="statusFilter" aria-label="Filtrar por status">
              <option value="all">Todos os status</option>
              <option value="reading">Lendo</option>
              <option value="planned">Quero ler</option>
              <option value="completed">Completo</option>
              <option value="paused">Pausado</option>
              <option value="dropped">Dropado</option>
            </select>
            <input id="searchInput" type="search" placeholder="Buscar manga, genero ou autor" />
          </div>
        </div>
        <div class="filter-bar" id="genreFilters"></div>
        <div class="manga-grid" id="mangaGrid"></div>
      </section>

      <section class="view page-view" id="detailsView" hidden>
        <button class="text-button" id="backToLibrary" type="button">Voltar</button>
        <div class="details-layout" id="detailsContent"></div>
      </section>

      <section class="view reader-view" id="readerView" hidden>
        <div class="reader-toolbar">
          <button class="text-button" id="closeReader" type="button" aria-label="Fechar leitor">Voltar</button>
          <div>
            <strong id="readerTitle"></strong>
            <span id="readerChapter"></span>
          </div>
          <select id="chapterSelect" aria-label="Selecionar capitulo"></select>
        </div>
        <div class="reader-pages" id="readerPages"></div>
      </section>

      <dialog class="edit-dialog" id="chapterDialog">
        <form class="edit-form" id="chapterForm" method="dialog">
          <div class="dialog-heading">
            <div>
              <p class="eyebrow">Capitulos</p>
              <h3>Adicionar capitulo</h3>
            </div>
            <button class="icon-button" id="closeChapterDialog" type="button" aria-label="Fechar">X</button>
          </div>
          <input name="mangaId" type="hidden" />
          <label>
            Titulo do capitulo
            <input name="chapterTitle" required placeholder="Capitulo 1" />
          </label>
          <label>
            Paginas do capitulo
            <textarea name="pages" placeholder="Opcional: uma URL de imagem por linha"></textarea>
          </label>
          <button class="button primary" type="submit">Adicionar capitulo</button>
        </form>
      </dialog>
    </main>

    <template id="mangaCardTemplate">
      <article class="manga-card">
        <button class="cover-button" type="button">
          <img alt="" loading="lazy" />
        </button>
        <div class="manga-card-body">
          <div>
            <h3></h3>
            <p></p>
          </div>
          <div class="card-meta"></div>
        </div>
      </article>
    </template>

    <script src="../app.js"></script>
  </body>
</html>
